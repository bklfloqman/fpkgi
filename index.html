<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FPKGi Game Library Viewer</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --panel-2: #232733;
    --accent: #4f8cff;
    --accent-2: #7c5cff;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --border: #2c313d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(180deg, #15181f 0%, #0f1115 100%);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
  }
  h1 { margin: 0 0 12px; font-size: 20px; letter-spacing: .3px; }
  h1 span { color: var(--accent); }
  .controls {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  }
  .controls input, .controls select {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font-size: 14px; outline: none;
  }
  .controls input:focus, .controls select:focus { border-color: var(--accent); }
  .controls input[type="text"] { flex: 1; min-width: 220px; }
  .stat { color: var(--muted); font-size: 13px; margin-left: auto; }
  .btn {
    background: var(--accent); color: #fff; border: none;
    border-radius: 8px; padding: 8px 14px; font-size: 14px;
    cursor: pointer; font-weight: 600;
  }
  .btn:hover { background: #3d7ae6; }
  .btn.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  .btn.secondary:hover { background: #2c313d; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 18px;
    padding: 24px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex; flex-direction: column;
    transition: transform .15s ease, border-color .15s ease;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .cover {
    width: 100%; aspect-ratio: 1 / 1;
    background: var(--panel-2);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover .fallback {
    color: var(--muted); font-size: 12px; text-align: center; padding: 8px;
  }
  .badges {
    position: absolute; top: 8px; left: 8px; right: 8px;
    display: flex; justify-content: space-between; pointer-events: none;
  }
  .badge {
    background: rgba(0,0,0,.7); backdrop-filter: blur(4px);
    padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
    color: #fff;
  }
  .badge.region-USA { background: rgba(79,140,255,.85); }
  .badge.region-EUR { background: rgba(124,92,255,.85); }
  .badge.region-JAP { background: rgba(255,92,140,.85); }
  .badge.region-ASI { background: rgba(255,165,0,.85); }

  .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .title { font-weight: 700; font-size: 14px; line-height: 1.3; }
  .genre { color: var(--accent); font-size: 12px; font-weight: 600; }
  .desc { color: var(--muted); font-size: 12px; line-height: 1.4; min-height: 34px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 6px; }
  .meta span {
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--muted); font-size: 11px; padding: 2px 7px; border-radius: 6px;
  }
  .empty { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 60px 20px; }

  /* Detail modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.7);
    display: none; align-items: center; justify-content: center; z-index: 100;
    padding: 20px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; max-width: 760px; width: 100%;
    max-height: 90vh; overflow: auto; display: flex; flex-direction: column;
  }
  .modal-head {
    display: flex; gap: 16px; padding: 18px;
    border-bottom: 1px solid var(--border);
  }
  .modal-head img {
    width: 140px; height: 140px; object-fit: cover; border-radius: 10px;
    background: var(--panel-2); flex-shrink: 0;
  }
  .modal-head .info { flex: 1; min-width: 0; }
  .modal-head h2 { margin: 0 0 6px; font-size: 18px; }
  .modal-head .g { color: var(--accent); font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .modal-head .d { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .modal-body { padding: 18px; }
  .field {
    display: grid; grid-template-columns: 140px 1fr;
    gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--border);
    font-size: 13px;
  }
  .field:last-child { border-bottom: none; }
  .field .k { color: var(--muted); }
  .field .v { color: var(--text); word-break: break-all; }
  .modal-actions {
    padding: 14px 18px; border-top: 1px solid var(--border);
    display: flex; gap: 10px; justify-content: flex-end;
  }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #fff; padding: 10px 18px; border-radius: 8px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .25s;
    z-index: 200;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>🎮 FPKGi <span>Library Viewer</span></h1>
  <div class="controls">
    <input type="text" id="search" placeholder="Search by title, genre, publisher...">
    <select id="regionFilter">
      <option value="">All Regions</option>
      <option value="USA">USA</option>
      <option value="EUR">EUR</option>
      <option value="JAP">JAP</option>
      <option value="ASI">ASI</option>
    </select>
    <select id="genreFilter">
      <option value="">All Genres</option>
    </select>
    <select id="sortBy">
      <option value="name">Sort: Name</option>
      <option value="size">Sort: Size</option>
      <option value="region">Sort: Region</option>
      <option value="version">Sort: Version</option>
    </select>
    <button class="btn secondary" id="loadFileBtn">📁 Load GAMES.json</button>
    <button class="btn" id="exportBtn">⬇ Export Enriched JSON</button>
    <span class="stat" id="stat">Loading…</span>
  </div>
  <input type="file" id="fileInput" accept=".json" hidden>
</header>

<div class="grid" id="grid"></div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-head">
      <img id="mCover" alt="">
      <div class="info">
        <h2 id="mTitle"></h2>
        <div class="g" id="mGenre"></div>
        <div class="d" id="mDesc"></div>
      </div>
    </div>
    <div class="modal-body" id="mBody"></div>
    <div class="modal-actions">
      <button class="btn secondary" id="mClose">Close</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

const FALLBACK_GENRES = ["Action","Adventure","RPG","Indie","Puzzle","Racing","Sports","Strategy","Simulation","Fighting","Horror","Shooter","Platformer"];
function pickFallback(name) {
  let h = 0; for (let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
  return FALLBACK_GENRES[h % FALLBACK_GENRES.length];
}

/* ---------- State ---------- */
let ALL = [];
let FILTERED = [];

/* ---------- Load JSON ---------- */
const grid = document.getElementById('grid');
const stat = document.getElementById('stat');
const searchInput = document.getElementById('search');
const regionFilter = document.getElementById('regionFilter');
const genreFilter = document.getElementById('genreFilter');
const sortBy = document.getElementById('sortBy');
const fileInput = document.getElementById('fileInput');

async function tryAutoLoad() {
  // Try to fetch GAMES.json from the same folder
  try {
    const res = await fetch('GAMES.json', {cache:'no-store'});
    if (!res.ok) throw new Error('no file');
    const json = await res.json();
    ingest(json);
  } catch(e) {
    // Fallback: try localStorage
    const cached = localStorage.getItem('fpkgi_data');
    if (cached) {
      try { ingest(JSON.parse(cached)); return; } catch(_) {}
    }
    grid.innerHTML = `<div class="empty">
      <p>No GAMES.json found in this folder.</p>
      <p style="margin-top:8px;">Click <b>📁 Load GAMES.json</b> to pick your file, or place GAMES.json next to this HTML file and refresh.</p>
    </div>`;
    stat.textContent = 'No data';
  }
}

function ingest(json) {
  const data = json.DATA || json;
  ALL = Object.entries(data).map(([url, g]) => {
    const meta = META[g.name] || {};
    return {
      url,
      title_id: g.title_id || '',
      region: g.region || 'UNK',
      name: g.name || 'Unknown',
      version: g.version || '',
      release: g.release || '',
      size: g.size || 0,
      min_fw: g.min_fw || '',
      cover_url: g.cover_url || '',
      genre: meta.genre || pickFallback(g.name || ''),
      publisher: meta.publisher || 'Unknown',
      description: meta.desc || `No description available. ${g.name || ''} is a ${meta.genre || pickFallback(g.name || '')} title.`
    };
  });
  localStorage.setItem('fpkgi_data', JSON.stringify(json));
  buildGenreFilter();
  applyFilters();
}

/* ---------- UI ---------- */
function buildGenreFilter() {
  const genres = [...new Set(ALL.map(g => g.genre))].sort();
  genreFilter.innerHTML = '<option value="">All Genres</option>' +
    genres.map(g => `<option value="${escapeAttr(g)}">${escapeHtml(g)}</option>`).join('');
}

function applyFilters() {
  const q = searchInput.value.trim().toLowerCase();
  const r = regionFilter.value;
  const gen = genreFilter.value;
  const s = sortBy.value;

  FILTERED = ALL.filter(g => {
    if (r && g.region !== r) return false;
    if (gen && g.genre !== gen) return false;
    if (q) {
      const hay = (g.name + ' ' + g.genre + ' ' + g.publisher + ' ' + g.description).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  FILTERED.sort((a,b) => {
    if (s === 'name') return a.name.localeCompare(b.name);
    if (s === 'size') return b.size - a.size;
    if (s === 'region') return a.region.localeCompare(b.region) || a.name.localeCompare(b.name);
    if (s === 'version') return a.version.localeCompare(b.version) || a.name.localeCompare(b.name);
    return 0;
  });

  render();
  stat.textContent = `${FILTERED.length} / ${ALL.length} games`;
}

function render() {
  if (!FILTERED.length) {
    grid.innerHTML = '<div class="empty">No games match your filters.</div>';
    return;
  }
  const html = FILTERED.map((g, i) => `
    <div class="card" data-i="${i}">
      <div class="cover">
        <div class="badges">
          <span class="badge region-${escapeAttr(g.region)}">${escapeHtml(g.region)}</span>
          <span class="badge">v${escapeHtml(g.version)}</span>
        </div>
        ${g.cover_url
          ? `<img loading="lazy" src="${escapeAttr(g.cover_url)}" alt="" onerror="this.style.display='none';this.parentNode.insertAdjacentHTML('beforeend','<div class=\\'fallback\\'>No cover</div>')">`
          : `<div class="fallback">No cover</div>`}
      </div>
      <div class="body">
        <div class="title">${escapeHtml(g.name)}</div>
        <div class="genre">${escapeHtml(g.genre)}</div>
        <div class="desc">${escapeHtml(truncate(g.description, 110))}</div>
        <div class="meta">
          <span>${escapeHtml(g.title_id)}</span>
          <span>${formatSize(g.size)}</span>
        </div>
      </div>
    </div>
  `).join('');
  grid.innerHTML = html;

  grid.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', () => openModal(FILTERED[+el.dataset.i]));
  });
}

function truncate(s, n) { return s.length > n ? s.slice(0, n-1) + '…' : s; }
function formatSize(b) {
  if (!b) return '—';
  const gb = b / (1024**3);
  if (gb >= 1) return gb.toFixed(2) + ' GB';
  return (b / (1024**2)).toFixed(0) + ' MB';
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return escapeHtml(s); }

/* ---------- Modal ---------- */
const modal = document.getElementById('modal');
function openModal(g) {
  document.getElementById('mCover').src = g.cover_url || '';
  document.getElementById('mCover').style.display = g.cover_url ? 'block' : 'none';
  document.getElementById('mTitle').textContent = g.name;
  document.getElementById('mGenre').textContent = g.genre + ' · ' + g.publisher;
  document.getElementById('mDesc').textContent = g.description;
  document.getElementById('mBody').innerHTML = `
    <div class="field"><div class="k">Title ID</div><div class="v">${escapeHtml(g.title_id)}</div></div>
    <div class="field"><div class="k">Region</div><div class="v">${escapeHtml(g.region)}</div></div>
    <div class="field"><div class="k">Version</div><div class="v">${escapeHtml(g.version)}</div></div>
    <div class="field"><div class="k">Release</div><div class="v">${escapeHtml(g.release)}</div></div>
    <div class="field"><div class="k">Size</div><div class="v">${formatSize(g.size)} (${g.size.toLocaleString()} bytes)</div></div>
    <div class="field"><div class="k">Min Firmware</div><div class="v">${escapeHtml(g.min_fw)}</div></div>
    <div class="field"><div class="k">Publisher</div><div class="v">${escapeHtml(g.publisher)}</div></div>
    <div class="field"><div class="k">PKG URL</div><div class="v">${escapeHtml(g.url)}</div></div>
  `;
  modal.classList.add('open');
}
document.getElementById('mClose').addEventListener('click', () => modal.classList.remove('open'));
modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });

/* ---------- Events ---------- */
searchInput.addEventListener('input', applyFilters);
regionFilter.addEventListener('change', applyFilters);
genreFilter.addEventListener('change', applyFilters);
sortBy.addEventListener('change', applyFilters);

document.getElementById('loadFileBtn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      ingest(JSON.parse(ev.target.result));
      toast('Loaded ' + f.name);
    } catch(err) {
      toast('Invalid JSON: ' + err.message);
    }
  };
  reader.readAsText(f);
});

/* ---------- Export enriched JSON ---------- */
document.getElementById('exportBtn').addEventListener('click', () => {
  const out = { DATA: {} };
  ALL.forEach(g => {
    out.DATA[g.url] = {
      title_id: g.title_id,
      region: g.region,
      name: g.name,
      version: g.version,
      release: g.release,
      size: g.size,
      min_fw: g.min_fw,
      cover_url: g.cover_url,
      genre: g.genre,
      publisher: g.publisher,
      description: g.description
    };
  });
  const blob = new Blob([JSON.stringify(out, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'GAMES-enriched.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Exported GAMES-enriched.json');
});

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- Init ---------- */
tryAutoLoad();
</script>
</body>
</html>
